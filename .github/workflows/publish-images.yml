name: Publish images to GHCR

on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'src/**'
      - 'web/**'
      - 'containers/**'
      - 'Dockerfile'
      - '.github/workflows/publish-images.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/virtual_substation_ot:latest
            ghcr.io/${{ github.repository_owner }}/virtual_substation_ot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  kali:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/kali.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/virtual_substation_ot-kali:latest
            ghcr.io/${{ github.repository_owner }}/virtual_substation_ot-kali:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
